<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111b33"/>
    </linearGradient>
    <linearGradient id="wool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f9ff"/>
      <stop offset="1" stop-color="#c7d0e8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#0eeefc" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#aaff00" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="600" cy="520" rx="320" ry="90" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <!-- Moon -->
    <circle cx="860" cy="210" r="54" fill="#f8f9ff" opacity="0.92"/>
    <circle cx="882" cy="198" r="48" fill="#111b33"/>

    <!-- Zzz -->
    <g fill="#0eeefc" opacity="0.85" font-family="Space Grotesk, Inter, sans-serif" font-weight="700">
      <text x="760" y="300" font-size="42">z</text>
      <text x="810" y="260" font-size="54">z</text>
      <text x="870" y="220" font-size="66">Z</text>
    </g>

    <!-- Body wool puffs -->
    <g fill="url(#wool)">
      <ellipse cx="520" cy="470" rx="92" ry="72"/>
      <ellipse cx="600" cy="500" rx="118" ry="86"/>
      <ellipse cx="690" cy="468" rx="96" ry="70"/>
      <ellipse cx="560" cy="430" rx="78" ry="58"/>
      <ellipse cx="640" cy="418" rx="88" ry="62"/>
      <ellipse cx="720" cy="432" rx="72" ry="54"/>
    </g>

    <!-- Head -->
    <ellipse cx="430" cy="430" rx="78" ry="68" fill="url(#wool)"/>

    <!-- Face -->
    <ellipse cx="404" cy="438" rx="10" ry="4" fill="#4a5568"/>
    <ellipse cx="452" cy="438" rx="10" ry="4" fill="#4a5568"/>
    <ellipse cx="428" cy="458" rx="8" ry="6" fill="#d674ff" opacity="0.55"/>

    <!-- Ear -->
    <ellipse cx="372" cy="392" rx="18" ry="28" fill="#d8deef" transform="rotate(-18 372 392)"/>

    <!-- Legs -->
    <g fill="#b8c0d8">
      <rect x="500" y="530" width="22" height="44" rx="11"/>
      <rect x="560" y="548" width="22" height="38" rx="11"/>
      <rect x="650" y="548" width="22" height="38" rx="11"/>
      <rect x="710" y="532" width="22" height="42" rx="11"/>
    </g>

    <!-- Tail puff -->
    <circle cx="770" cy="470" r="24" fill="url(#wool)"/>
  </g>
</svg>
